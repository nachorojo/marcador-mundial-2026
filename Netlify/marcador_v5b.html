<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marcador · Mundial 2026</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}

.mw-wrap{container-type:inline-size;container-name:mw;width:100%;max-width:100%;}

.marcador{
  background:#0e0e0e;border-radius:10px;overflow:hidden;
  display:flex;align-items:stretch;width:100%;max-width:100%;
}

/* ── LOGO ── */
.col-logo{
  background:#181818;border-right:1px solid #272727;
  display:flex;align-items:center;justify-content:center;
  padding:10px 12px;width:70px;flex-shrink:0;
}
.col-logo img{width:44px;height:44px;object-fit:contain;display:block;}

/* ── COLUMNA CENTRAL ── */
.col-main{flex:1;display:flex;flex-direction:column;min-width:0;}

/* ── BARRA INFO ── */
.info-bar{
  display:flex;align-items:center;padding:0 14px;gap:8px;
  border-bottom:1px solid #1e1e1e;min-height:28px;
}
.info-fase{
  font-size:10px;font-weight:700;text-transform:uppercase;
  letter-spacing:.9px;color:#bbb;white-space:nowrap;
  text-decoration:none;flex-shrink:0;
}
.info-fase:hover{color:#fff;}
a.info-fase{cursor:pointer;}
.info-sep-bar{
  font-size:9px;color:#444;flex-shrink:0;
}
.info-estadio{
  font-size:11px;color:#aaa;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  flex:1;min-width:0;
}
.info-estado{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  gap:6px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.5px;color:#e5e7eb;
  padding:0 10px;
}
.info-cal{
  flex-shrink:0;display:flex;align-items:center;
  padding:0;
}
.info-cal a{
  color:#aaa;font-size:10px;font-weight:700;text-decoration:none;
  text-transform:uppercase;letter-spacing:.6px;white-space:nowrap;
  opacity:.7;transition:opacity .2s;display:flex;align-items:center;gap:4px;
  padding:8px 0 8px 8px;
}
.info-cal a:hover{opacity:1;color:#fff;}

/* ── PANEL BLANCO ── */
.panel{
  flex:1;background:#fff;margin:6px 10px;border-radius:7px;
  display:flex;align-items:center;padding:7px 12px;gap:12px;
  position:relative;overflow:hidden;
}
.panel.is-live::after{
  content:'';position:absolute;bottom:0;left:0;right:0;height:3px;
  background:linear-gradient(90deg,#1d4ed8,#3b82f6,#1d4ed8);
  background-size:200% 100%;animation:linea 2s linear infinite;
}
@keyframes linea{0%{background-position:0% 0%;}100%{background-position:200% 0%;}}

/* ── EQUIPOS ── */
.equipo{flex:1;display:flex;align-items:center;gap:10px;min-width:0;}
.equipo.visit{flex-direction:row-reverse;text-align:right;}
.flag-wrap{
  width:40px;height:40px;border-radius:50%;overflow:hidden;
  flex-shrink:0;box-shadow:0 1px 5px rgba(0,0,0,.22);background:#e5e7eb;
}
.flag-wrap img{width:100%;height:100%;object-fit:cover;object-position:center;display:block;}
.eq-info{min-width:0;}
.eq-nombre{
  font-size:16px;font-weight:800;color:#0e0e0e;text-transform:uppercase;
  letter-spacing:.2px;line-height:1.1;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  text-decoration:none;display:block;
}
.eq-nombre:hover{color:#1d4ed8;}
.eq-goles{
  font-size:10px;color:#6b7280;margin-top:3px;line-height:1.4;
  overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;
}

/* ── MARCADOR CENTRAL ── */
.score-wrap{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;}
.score-nums{display:flex;align-items:center;gap:7px;}
.score-box{
  width:44px;height:44px;border:2px solid #1a1a1a;border-radius:7px;
  display:flex;align-items:center;justify-content:center;
  font-size:28px;font-weight:900;color:#0e0e0e;line-height:1;
}
.score-dash{font-size:22px;font-weight:300;color:#9ca3af;}
.hora-grande{font-size:24px;font-weight:700;color:#0e0e0e;padding:0 10px;letter-spacing:.5px;}
.minuto-live{font-size:10px;font-weight:700;color:#2563eb;letter-spacing:.3px;}
.pen-bloque{display:flex;align-items:center;gap:4px;margin-top:2px;}
.pen-chip{
  display:flex;align-items:center;gap:5px;
  background:rgba(0,0,0,.07);border-radius:20px;
  padding:1px 9px;
}
.pen-num{font-size:13px;font-weight:800;color:#1e293b;}
.pen-sep{font-size:12px;color:#94a3b8;font-weight:300;}

/* ── DOTS ── */
.dot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.dot-live{background:#22c55e;animation:blink 1.5s ease-in-out infinite;}
.dot-fin{background:#ef4444;}
.dot-prox{background:#6b7280;}
.dot-pen{background:#f97316;animation:blink 1.5s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.2;transform:scale(.6);}}

/* ── ERROR ── */
.error-msg{color:#fff;font-size:12px;padding:20px;text-align:center;opacity:.6;font-style:italic;}

/* ══ CONTAINER QUERIES ══ */
@container mw (max-width: 660px){
  .col-logo{width:56px;padding:8px 10px;}
  .col-logo img{width:34px;height:34px;}
  .flag-wrap{width:33px;height:33px;}
  .eq-nombre{font-size:13px;}
  .score-box{width:40px;height:40px;font-size:26px;}
  .score-dash{font-size:20px;}
  .panel{padding:8px 12px;gap:10px;margin:7px 10px;}
  .info-estadio{display:none;}
  .info-sep-bar{display:none;}
}
@container mw (max-width: 480px){
  .col-logo{display:none;}
  .eq-goles{display:none;}
  .eq-nombre{font-size:12px;}
  .flag-wrap{width:28px;height:28px;}
  .score-box{width:34px;height:34px;font-size:21px;border-width:1.5px;}
  .score-dash{font-size:17px;}
  .panel{padding:7px 10px;gap:8px;margin:6px 8px;}
  .info-bar{padding:0 8px;gap:5px;}
  .info-fase{font-size:9px;}
  .info-cal a{font-size:9px;}
}
@container mw (max-width: 340px){
  .info-cal{display:none;}
  .eq-nombre{font-size:11px;}
  .score-box{width:28px;height:28px;font-size:17px;}
  .info-fase{display:none;}
  .flag-wrap{width:22px;height:22px;}
}

  ═══════════════════════════════════════════════════════════════════════════
  MARCADOR MUNDIAL 2026 · v5b
  ═══════════════════════════════════════════════════════════════════════════

  MODO DE USO: archivo alojado en un servidor (ej. atreslab.com).
  El CMS lo embebe como <iframe src="...marcador_v5b.html?id=...&numero=...">
  Los redactores solo cambian los parámetros de la URL del iframe.

  ✅ Equipos, banderas, grupo, estadio y hora → AUTOMÁTICOS (datos embebidos)
  ✅ Enlace a artículo de cada selección → AUTOMÁTICO
  ✅ Enlace al artículo del grupo → AUTOMÁTICO
  ✅ Marcador en directo → AUTOMÁTICO vía API football-data.org
     · Se refresca solo cada 60 segundos mientras el partido está en juego
     · Si la API falla, se muestran los datos manuales sin error visible
  ✅ Los parámetros manuales siguen funcionando como override de la API

  PARÁMETROS DE URL (usar en el src del iframe):

  Obligatorios:
    id=2026-06-15       → fecha en formato YYYY-MM-DD
    numero=3            → nº de partido del día, empezando en 1

  Opcionales (sobreescriben datos automáticos):
    estado=finalizado   → programado | primera-parte | segunda-parte |
                          prorroga-primera | prorroga-segunda | penaltis | finalizado
    gL=3                → goles local
    gV=0                → goles visitante
    pL=4 & pV=5         → penaltis (ambos necesarios para mostrar la sección)
    golL=Yamal+23%27    → goleadores local (URL-encoded)
    golV=Muller+12%27   → goleadores visitante (URL-encoded)
    estadio=MetLife+Stadium+%C2%B7+NJ  → estadio (URL-encoded)
    minuto=34%27        → minuto en juego (solo estados en vivo)

  EJEMPLOS:
    ?id=2026-06-15&numero=3
      → España vs Cabo Verde, Grupo H, Programado, 18:00

    ?id=2026-06-15&numero=3&gL=3&gV=0&estado=finalizado&golL=Yamal+23%27%2C+Morata+67%27
      → España 3-0 Cabo Verde, Grupo H, Finalizado, con goleadores

    ?id=2026-06-15&numero=3&gL=1&gV=1&estado=primera-parte&minuto=34%27
      → España 1-1 Cabo Verde, 1ª Parte · 34', línea azul animada

    ?id=2026-06-15&numero=3&gL=1&gV=1&pL=4&pV=5&estado=finalizado
      → España 1-1 (4-5 en pen.), Grupo H, Finalizado
  ═══════════════════════════════════════════════════════════════════════════
-->

/* ══════════════════════════════════════════════════════════════════════════
   API football-data.org
══════════════════════════════════════════════════════════════════════════ */
var _API_TOKEN = 'e2a9e5be74014367afcf1cf1138d6341';
var _apiTimer  = null;
var _encRef    = null; // referencia al encuentro actual (se asigna en render)

// Nombres de equipo en la API → código FIFA
var _API_NOMBRES = {
  'Mexico':'MEX','South Africa':'RSA','South Korea':'KOR','Czechia':'CZE',
  'Canada':'CAN','Bosnia and Herzegovina':'BIH','Qatar':'QAT','Switzerland':'SUI',
  'Brazil':'BRA','Morocco':'MAR','Haiti':'HAI','Scotland':'SCO',
  'United States':'USA','Paraguay':'PAR','Australia':'AUS','Türkiye':'TUR',
  'Germany':'GER','Curaçao':'CUR',"Côte d'Ivoire":'CIV','Ecuador':'ECU',
  'Netherlands':'NED','Japan':'JPN','Sweden':'SWE','Tunisia':'TUN',
  'Belgium':'BEL','Egypt':'EGY','Iran':'IRN','New Zealand':'NZL',
  'Spain':'ESP','Cape Verde':'CPV','Saudi Arabia':'KSA','Uruguay':'URU',
  'France':'FRA','Senegal':'SEN','Iraq':'IRQ','Norway':'NOR',
  'Argentina':'ARG','Algeria':'DZA','Austria':'AUT','Jordan':'JOR',
  'Portugal':'POR','DR Congo':'COD','Uzbekistan':'UZB','Colombia':'COL',
  'England':'ENG','Croatia':'CRO','Ghana':'GHA','Panama':'PAN',
};

function _codigoANombre(cod) {
  for (var n in _API_NOMBRES) { if (_API_NOMBRES[n] === cod) return n; }
  return cod;
}

function _apiEstado(m) {
  var st = m.status, min = m.minute || 0;
  if (st === 'IN_PLAY')    return min > 45 ? 'segunda-parte' : 'primera-parte';
  if (st === 'EXTRA_TIME') return min > 105 ? 'prorroga-segunda' : 'prorroga-primera';
  var map = { TIMED:'programado', SCHEDULED:'programado', PAUSED:'segunda-parte',
              PENALTY_SHOOTOUT:'penaltis', FINISHED:'finalizado' };
  return map[st] || 'programado';
}

function _apiFetch() {
  if (!_encRef) return;
  var dateStr = new URLSearchParams(window.location.search).get('id');
  if (!dateStr) return;
  // Solo ejecutar si no hay override manual de estado en la URL
  var params = new URLSearchParams(window.location.search);
  var tieneManual = params.get('gL') !== null && params.get('gV') !== null;

  fetch('https://api.football-data.org/v4/competitions/WC/matches?dateFrom=' + dateStr + '&dateTo=' + dateStr,
    { headers: { 'X-Auth-Token': _API_TOKEN } })
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (!data.matches) return;
    var nomLocal = _codigoANombre(_encRef.local);
    var nomVis   = _codigoANombre(_encRef.visitante);
    var found = null;
    for (var i = 0; i < data.matches.length; i++) {
      var m = data.matches[i];
      if (m.homeTeam.name === nomLocal && m.awayTeam.name === nomVis) { found = m; break; }
    }
    if (!found) return;

    var estado = _apiEstado(found);
    var ft  = (found.score || {}).fullTime  || {};
    var pen = (found.score || {}).penalties || {};
    var esVivo = ['primera-parte','segunda-parte','prorroga-primera','prorroga-segunda','penaltis'].indexOf(estado) > -1;
    var esFin  = estado === 'finalizado';

    // Solo actualizar si la API tiene datos de marcador Y no hay override manual
    if (!tieneManual && (esVivo || esFin) && ft.home != null) {
      _apiActualizarDOM(estado, ft.home, ft.away, pen.home, pen.away, found.minute);
    }

    // Repetir cada 60s si sigue vivo
    clearTimeout(_apiTimer);
    if (esVivo) _apiTimer = setTimeout(_apiFetch, 60000);
  })
  .catch(function(){}); // silencioso — muestra datos manuales si falla
}

function _apiActualizarDOM(estado, gL, gV, pL, pV, minuto) {
  var cfgs = {
    'programado':       { label:'Próximo',       dot:'dot dot-prox' },
    'primera-parte':    { label:'1ª Parte',       dot:'dot dot-live' },
    'segunda-parte':    { label:'2ª Parte',       dot:'dot dot-live' },
    'prorroga-primera': { label:'Prórroga · 1ª', dot:'dot dot-live' },
    'prorroga-segunda': { label:'Prórroga · 2ª', dot:'dot dot-live' },
    'penaltis':         { label:'Penaltis',       dot:'dot dot-pen'  },
    'finalizado':       { label:'Finalizado',     dot:'dot dot-fin'  },
  };
  var cfg = cfgs[estado] || cfgs['programado'];
  var esLive = ['primera-parte','segunda-parte','prorroga-primera','prorroga-segunda','penaltis'].indexOf(estado) > -1;

  // Estado en barra info
  var eHTML = '<span class="' + cfg.dot + '"></span>' + cfg.label;
  if (esLive && minuto) eHTML += ' <span class="minuto-live">· ' + minuto + "'</span>";
  var el = document.querySelector('.info-estado');
  if (el) el.innerHTML = eHTML;

  // Línea live
  var panel = document.getElementById('panel');
  if (panel) esLive ? panel.classList.add('is-live') : panel.classList.remove('is-live');

  // Marcador
  var sw = document.getElementById('score-wrap');
  if (!sw || gL == null) return;
  var penHTML = '';
  if (pL != null && pV != null) {
    penHTML = '<div class="pen-bloque"><div class="pen-chip">'
      + '<span class="pen-num">' + pL + '</span>'
      + '<span class="pen-sep">–</span>'
      + '<span class="pen-num">' + pV + '</span>'
      + '</div></div>';
  }
  sw.innerHTML = '<div class="score-nums">'
    + '<div class="score-box">' + gL + '</div>'
    + '<div class="score-dash">–</div>'
    + '<div class="score-box">' + gV + '</div>'
    + '</div>' + penHTML;
}

/* ══════════════════════════════════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════════════════════════════════ */
(function(){
  var CDN = 'https://www.ondacero.es/newa3flash/onda_cero/mundialcatar/cuadro/flags/4x3/';

  var ESTADOS_CFG = {
    'programado':        { label:'Próximo',       dot:'dot dot-prox' },
    'primera-parte':     { label:'1ª Parte',       dot:'dot dot-live' },
    'segunda-parte':     { label:'2ª Parte',       dot:'dot dot-live' },
    'prorroga-primera':  { label:'Prórroga · 1ª', dot:'dot dot-live' },
    'prorroga-segunda':  { label:'Prórroga · 2ª', dot:'dot dot-live' },
    'penaltis':          { label:'Penaltis',       dot:'dot dot-pen'  },
    'finalizado':        { label:'Finalizado',     dot:'dot dot-fin'  },
  };

  var FASE_LABELS = {
    'Fase de grupos':         '',
    'Dieciseisavos de final': 'Dieciseisavos',
    'Octavos de final':       'Octavos',
    'Cuartos de final':       'Cuartos de final',
    'Semifinales':            'Semifinales',
    'Tercer y cuarto puesto': '3er y 4º puesto',
    'Final':                  'Final',
  };

  /* ── Leer URL params ── */
  var params = new URLSearchParams(window.location.search);
  var id     = params.get('id');
  var numero = parseInt(params.get('numero') || '1', 10) - 1;

  /* ── Buscar partido ── */
  var dia = null, enc = null;
  for (var i = 0; i < CALENDARIO.length; i++) {
    if (CALENDARIO[i].id === id) { dia = CALENDARIO[i]; break; }
  }
  if (dia) enc = dia.encuentros[numero] || null;
  _encRef = enc; // guardar para la API

  if (!dia || !enc) {
    document.getElementById('marcador').innerHTML =
      '<div class="error-msg">Partido no encontrado. Comprueba los parámetros id y numero.</div>';
    return;
  }

  /* ── Datos de equipo ── */
  var locData = PAISES[enc.local]     || { nombre:enc.local,     flag:'xx', grupo:'', url:'#' };
  var visData = PAISES[enc.visitante] || { nombre:enc.visitante, flag:'xx', grupo:'', url:'#' };

  /* ── Estado inicial (manual o del calendario) ── */
  var estadoBase = enc.estado === 'cronica' ? 'finalizado' : (enc.estado || 'programado');
  var estado = params.get('estado') || estadoBase;
  var cfg    = ESTADOS_CFG[estado]  || ESTADOS_CFG['programado'];
  var esLive = ['primera-parte','segunda-parte','prorroga-primera','prorroga-segunda','penaltis'].indexOf(estado) > -1;
  var esProg = estado === 'programado';

  /* ── Goles ── */
  var gL = 0, gV = 0;
  if (params.get('gL') !== null && params.get('gV') !== null) {
    gL = parseInt(params.get('gL'), 10) || 0;
    gV = parseInt(params.get('gV'), 10) || 0;
  }

  /* ── Penaltis ── */
  var pL = params.get('pL'), pV = params.get('pV');
  var penaltis = {
    local: parseInt(pL || 0), visitante: parseInt(pV || 0),
    mostrar: !!(pL !== null && pL !== '' && pV !== null && pV !== '')
  };

  /* ── Extras ── */
  var goleadoresL = params.get('golL') || '';
  var goleadoresV = params.get('golV') || '';
  var estadio     = params.get('estadio') || (enc.n ? (ESTADIOS[enc.n] || '') : '');
  var minuto      = params.get('minuto') || '';

  /* ── Grupo auto-detectado ── */
  var grupo = locData.grupo || visData.grupo || '';
  var grupoData = grupo ? (GRUPOS[grupo] || null) : null;

  /* ── Banderas ── */
  var fl = document.getElementById('flag-local');
  fl.src = CDN + locData.flag + '.svg';
  fl.alt = locData.nombre;

  var fv = document.getElementById('flag-visit');
  fv.src = CDN + visData.flag + '.svg';
  fv.alt = visData.nombre;

  /* ── Nombres (enlazados) ── */
  var nl = document.getElementById('nombre-local');
  nl.textContent = locData.nombre;
  nl.href = locData.url || '#';

  var nv = document.getElementById('nombre-visit');
  nv.textContent = visData.nombre;
  nv.href = visData.url || '#';

  /* ── Goleadores ── */
  if (goleadoresL) document.getElementById('goles-local').textContent = goleadoresL;
  if (goleadoresV) document.getElementById('goles-visit').textContent = goleadoresV;

  /* ── Info bar ── */
  var faseLabel, faseUrl;
  if (grupo && dia.fase === 'Fase de grupos') {
    faseLabel = 'Grupo ' + grupo;
    faseUrl   = grupoData ? grupoData.url : URL_CALENDARIO;
  } else {
    faseLabel = FASE_LABELS[dia.fase] || dia.fase;
    faseUrl   = URL_CALENDARIO;
  }

  var infoBar = document.getElementById('info-bar');
  var leftHTML = '<a class="info-fase" href="' + faseUrl + '" target="_top">' + faseLabel + '</a>';
  if (estadio) {
    leftHTML += '<span class="info-sep-bar">·</span>'
              + '<span class="info-estadio">' + estadio + '</span>';
  }
  leftHTML += '<span class="info-sep-bar">·</span>'
            + '<span class="info-estadio">' + dia.fecha + '</span>';

  var eHTML = '<span class="' + cfg.dot + '"></span>' + cfg.label;
  if (esLive && minuto) eHTML += ' <span class="minuto-live">· ' + minuto + '</span>';
  var centerHTML = '<span class="info-estado">' + eHTML + '</span>';
  var rightHTML  = '<span class="info-cal"><a href="' + URL_CALENDARIO + '" target="_top">▶ Calendario</a></span>';
  infoBar.innerHTML = leftHTML + centerHTML + rightHTML;

  /* ── Panel live ── */
  if (esLive) document.getElementById('panel').classList.add('is-live');

  /* ── Marcador central (inicial) ── */
  var sw = document.getElementById('score-wrap');
  if (esProg) {
    sw.innerHTML = '<div class="hora-grande">' + enc.hora + 'h</div>';
  } else {
    var penHTML = '';
    if (penaltis.mostrar) {
      penHTML = '<div class="pen-bloque"><div class="pen-chip">'
        + '<span class="pen-num">' + penaltis.local + '</span>'
        + '<span class="pen-sep">–</span>'
        + '<span class="pen-num">' + penaltis.visitante + '</span>'
        + '</div></div>';
    }
    sw.innerHTML =
      '<div class="score-nums">'
        + '<div class="score-box">' + gL + '</div>'
        + '<div class="score-dash">–</div>'
        + '<div class="score-box">' + gV + '</div>'
      + '</div>' + penHTML;
  }

  /* ── Color de fondo (param ?fondo=304ffe) ── */
  var fondo = params.get('fondo');
  if (fondo) {
    var color = '#' + fondo.replace('#','');
    document.getElementById('marcador').style.background = color;
    var colLogo = document.querySelector('.col-logo');
    if (colLogo) colLogo.style.background = color;
    var infoBar = document.querySelector('.info-bar');
    if (infoBar) infoBar.style.borderBottomColor = 'rgba(255,255,255,.1)';
  }

  /* ── Arrancar: override primero, luego API ── */
  _overrideFetch();

})();

/* ══════════════════════════════════════════════════════════════════════════
   OVERRIDE — Firebase Realtime DB + caché localStorage
   Al recargar: muestra el último estado conocido al instante,
   luego confirma/actualiza desde Firebase.
══════════════════════════════════════════════════════════════════════════ */
var _FIREBASE = 'https://marcador-mundial-2026-default-rtdb.europe-west1.firebasedatabase.app';
var _overrideTimer = null;

function _aplicarDatos(data) {
  if (!data || Object.keys(data).length === 0) return;
  var estado = data.estado || 'programado';
  var gL = data.gL != null ? data.gL : null;
  var gV = data.gV != null ? data.gV : null;
  var pL = (data.pL != null && data.pV != null) ? data.pL : null;
  var pV = (data.pL != null && data.pV != null) ? data.pV : null;
  // Siempre actualizar estado/dot, aunque no haya goles
  _apiActualizarDOM(estado, gL, gV, pL, pV, data.minuto || '');
  var elGL = document.getElementById('goles-local');
  var elGV = document.getElementById('goles-visit');
  if (elGL && data.golL) elGL.textContent = data.golL;
  if (elGV && data.golV) elGV.textContent = data.golV;
}

function _overrideFetch() {
  var params = new URLSearchParams(window.location.search);
  var id     = params.get('id');
  var numero = params.get('numero') || '1';
  if (!id) return;

  // Solo saltar Firebase si hay goles explícitos en la URL (override manual específico)
  if (params.get('gL') !== null && params.get('gV') !== null) return;

  // Sanitizar numero (eliminar cualquier carácter no numérico)
  numero = (numero + '').replace(/[^0-9]/g, '') || '1';

  var key      = id + '-' + numero;
  var lsKey    = 'mw26-' + key;

  // 1. Aplicar caché localStorage inmediatamente (sin parpadeo al recargar)
  try {
    var cached = localStorage.getItem(lsKey);
    if (cached) _aplicarDatos(JSON.parse(cached));
  } catch(e) {}

  // 2. Consultar Firebase para confirmar/actualizar
  fetch(_FIREBASE + '/partidos/' + key + '.json')
  .then(function(r){ return r.json(); })
  .then(function(data){
    if (data && Object.keys(data).length > 0) {
      _aplicarDatos(data);
      try { localStorage.setItem(lsKey, JSON.stringify(data)); } catch(e) {}
    } else {
      // Sin datos en Firebase: borrar caché para no mostrar estado obsoleto
      try { localStorage.removeItem(lsKey); } catch(e) {}
    }
    clearTimeout(_overrideTimer);
    _overrideTimer = setTimeout(_overrideFetch, 10000);
  })
  .catch(function(){
    // Sin conexión: el localStorage ya mostró el último estado conocido
    clearTimeout(_overrideTimer);
    _overrideTimer = setTimeout(_overrideFetch, 60000);
  });
}
