<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{background:#fff;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;}

.pw-wrap{
  width:100%;border-top:3px solid #111;border-bottom:3px solid #111;
  display:flex;align-items:stretch;background:#fff;overflow:hidden;
  min-height:72px;
}

/* ── Logo ── */
.pw-logo{
  width:60px;flex-shrink:0;background:#111;
  display:flex;align-items:center;justify-content:center;padding:8px;
  border-right:3px solid #111;
}
.pw-logo img{width:38px;height:38px;object-fit:contain;display:block;}

/* ── Cards ── */
.pw-cards{flex:1;overflow:hidden;position:relative;}

.pw-track{display:flex;transition:transform .35s cubic-bezier(.4,0,.2,1);will-change:transform;}
.pw-group{flex:none;display:flex;}

.pw-card{
  flex:1;border-right:4px double #ccc;padding:6px 10px;
  display:flex;flex-direction:column;justify-content:center;align-items:center;gap:5px;
}
.pw-card:last-child{border-right:none;}

/* ── Cabecera: fecha + estado ── */
.pw-head{display:flex;align-items:center;gap:5px;font-size:10.5px;color:#666;flex-wrap:nowrap;}
.pw-fecha{font-weight:600;white-space:nowrap;}
.pw-sep{color:#bbb;font-size:10px;}
.pw-estado{font-weight:800;font-size:10.5px;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;}
.pw-estado.fin {color:#dc2626;}
.pw-estado.live{color:#16a34a;display:flex;align-items:center;gap:3px;}
.pw-estado.prox{color:#9ca3af;}
.pw-dot{width:6px;height:6px;background:#16a34a;border-radius:50%;animation:pw-blink 1s ease-in-out infinite;flex-shrink:0;}
@keyframes pw-blink{0%,100%{opacity:1}50%{opacity:.25}}

/* ── Cuerpo: equipos + marcador ── */
.pw-body{display:flex;align-items:center;gap:4px;}
.pw-team{display:flex;align-items:center;gap:3px;font-size:17px;font-weight:800;color:#111;min-width:0;}
.pw-team.vis{flex-direction:row-reverse;}
.pw-flag{width:18px;height:13px;object-fit:cover;border:1px solid #e5e7eb;flex-shrink:0;display:block;}
.pw-cod{white-space:nowrap;}
a.pw-cod{color:inherit;text-decoration:none;}
a.pw-cod:hover{text-decoration:underline;}
.pw-score{
  font-size:17px;font-weight:900;color:#111;letter-spacing:-1px;
  padding:0 6px;white-space:nowrap;flex-shrink:0;
}
.pw-score.prox{font-size:14px;font-weight:600;color:#d1d5db;}

/* ── Flecha ── */
.pw-arrow{
  width:34px;flex-shrink:0;background:#111;border:none;
  color:#fff;font-size:16px;cursor:pointer;display:none;
  align-items:center;justify-content:center;
  transition:background .15s;
}
.pw-arrow:hover{background:#333;}
.pw-arrow.visible{display:flex;}

@media(max-width:600px){
  .pw-card{padding:5px 6px;gap:3px;}
  .pw-score{font-size:14px;padding:0 4px;}
  .pw-team{font-size:14px;}
  .pw-flag{width:15px;height:11px;}
  .pw-head{font-size:9.5px;}
}
</style>
</head>

var ESTADOS = {
  'programado':       {txt:'PRÓXIMO',    txtM:'PRÓX',  cls:'prox'},
  'primera-parte':    {txt:'EN JUEGO',   txtM:'VIVO',  cls:'live'},
  'descanso':         {txt:'DESCANSO',   txtM:'DESC',  cls:'prox'},
  'segunda-parte':    {txt:'EN JUEGO',   txtM:'VIVO',  cls:'live'},
  'prorroga-primera': {txt:'PRÓRROGA',   txtM:'PRORR', cls:'live'},
  'prorroga-segunda': {txt:'PRÓRROGA',   txtM:'PRORR', cls:'live'},
  'penaltis':         {txt:'PENALTIS',   txtM:'PEN',   cls:'live'},
  'finalizado':       {txt:'FINALIZADO', txtM:'FIN',   cls:'fin'},
};

function pwGetHoy() {
  if (HOY !== 'auto') return HOY;
  var d = new Date();
  return d.getFullYear() + '-'
    + ('0'+(d.getMonth()+1)).slice(-2) + '-'
    + ('0'+d.getDate()).slice(-2);
}

function pwRender(resultados) {
  var hoy = pwGetHoy();
  var lista = [];
  for (var i = 0; i < CALENDARIO.length && lista.length < 8; i++) {
    var dia = CALENDARIO[i];
    if (dia.id.substring(0,10) < hoy) continue;
    for (var j = 0; j < dia.encuentros.length && lista.length < 8; j++) {
      var enc = dia.encuentros[j];
      var res = (resultados && resultados[enc.n]) || {};
      lista.push({
        fecha:  dia.fecha,
        hora:   enc.hora,
        local:  enc.local,
        vis:    enc.visitante,
        n:      enc.n,
        estado: res.estado || 'programado',
        gL:     res.gL != null ? res.gL : null,
        gV:     res.gV != null ? res.gV : null,
      });
    }
  }

  var contenedor = document.getElementById('pw-cards');
  contenedor.innerHTML = '';
  _pag = 0;

  var track = document.createElement('div');
  track.id = 'pw-track';
  track.className = 'pw-track';
  contenedor.appendChild(track);

  var gs = window.innerWidth <= 640 ? 2 : 4;
  var grupos = Math.ceil(lista.length / gs) || 1;
  for (var g = 0; g < grupos; g++) {
    var div = document.createElement('div');
    div.className = 'pw-group';
    div.id = 'pw-g-' + g;
    for (var k = g*gs; k < Math.min(g*gs+gs, lista.length); k++) {
      div.appendChild(pwMakeCard(lista[k]));
    }
    track.appendChild(div);
  }

  // Fijar ancho de cada grupo al ancho visible del contenedor
  var cw = contenedor.offsetWidth;
  track.querySelectorAll('.pw-group').forEach(function(el){ el.style.width = cw + 'px'; });

  // Swipe táctil
  var _tx = 0;
  contenedor.addEventListener('touchstart', function(e){
    _tx = e.touches[0].clientX;
    track.style.transition = 'none';
  }, {passive:true});
  contenedor.addEventListener('touchmove', function(e){
    var dx = e.touches[0].clientX - _tx;
    track.style.transform = 'translateX(' + (-_pag * cw + dx) + 'px)';
  }, {passive:true});
  contenedor.addEventListener('touchend', function(e){
    var dx = e.changedTouches[0].clientX - _tx;
    track.style.transition = 'transform .35s cubic-bezier(.4,0,.2,1)';
    if (dx < -40 && _pag < grupos - 1) _pag++;
    else if (dx > 40 && _pag > 0) _pag--;
    track.style.transform = 'translateX(' + (-_pag * cw) + 'px)';
    pwUpdateArrow();
  }, {passive:true});

  var btn = document.getElementById('pw-arrow');
  btn.textContent = '▶';
  grupos > 1 ? btn.classList.add('visible') : btn.classList.remove('visible');
}

function pwMakeCard(p) {
  var lf      = (PAISES[p.local] || _equiposKO[p.local] || {flag:'xx'}).flag;
  var vf      = (PAISES[p.vis]   || _equiposKO[p.vis]   || {flag:'xx'}).flag;
  var lnombre = _equiposKO[p.local] ? _equiposKO[p.local].nombre : p.local;
  var vnombre = _equiposKO[p.vis]   ? _equiposKO[p.vis].nombre   : p.vis;
  var lurl    = (PAISES[p.local] || {}).url || (_equiposKO[p.local] || {}).url || '';
  var vurl    = (PAISES[p.vis]   || {}).url || (_equiposKO[p.vis]   || {}).url || '';
  var ltag    = lurl ? 'a class="pw-cod" href="' + lurl + '" target="_blank"' : 'span class="pw-cod"';
  var vtag    = vurl ? 'a class="pw-cod" href="' + vurl + '" target="_blank"' : 'span class="pw-cod"';
  var lclose  = lurl ? 'a' : 'span';
  var vclose  = vurl ? 'a' : 'span';
  var es    = ESTADOS[p.estado] || ESTADOS['programado'];
  var esProg = p.estado === 'programado' || p.estado === 'descanso';
  var esLive = es.cls === 'live';
  var isMob  = window.innerWidth <= 640;
  var etxt   = isMob ? (es.txtM || es.txt) : es.txt;
  var fecha  = isMob
    ? p.fecha.split(' ')[0] + p.fecha.split(' ')[1][0]
    : p.fecha;

  var estHTML = esLive
    ? '<span class="pw-estado live"><span class="pw-dot"></span>' + etxt + '</span>'
    : '<span class="pw-estado ' + es.cls + '">' + etxt + '</span>';

  var scoreHTML = (p.gL !== null && p.gV !== null && !esProg)
    ? '<span class="pw-score">' + p.gL + ' - ' + p.gV + '</span>'
    : '<span class="pw-score prox">–</span>';

  var c = document.createElement('div');
  c.className = 'pw-card';
  c.innerHTML =
    '<div class="pw-head">'
      + '<span class="pw-fecha">' + fecha + ' ' + p.hora + '</span>'
      + '<span class="pw-sep">||</span>'
      + estHTML
    + '</div>'
    + '<div class="pw-body">'
      + '<span class="pw-team">'
        + '<img class="pw-flag" src="' + CDN + lf + '.svg" alt="">'
        + '<' + ltag + '>' + lnombre + '</' + lclose + '>'
      + '</span>'
      + scoreHTML
      + '<span class="pw-team vis">'
        + '<img class="pw-flag" src="' + CDN + vf + '.svg" alt="">'
        + '<' + vtag + '>' + vnombre + '</' + vclose + '>'
      + '</span>'
    + '</div>';
  return c;
}

function pwUpdateArrow() {
  var n = document.querySelectorAll('.pw-group').length;
  document.getElementById('pw-arrow').textContent = (_pag >= n - 1) ? '◀' : '▶';
}
function pwToggle() {
  var n = document.querySelectorAll('.pw-group').length;
  if (n < 2) return;
  var track = document.getElementById('pw-track');
  var cw    = document.getElementById('pw-cards').offsetWidth;
  _pag = (_pag + 1) % n;
  track.style.transition = 'transform .35s cubic-bezier(.4,0,.2,1)';
  track.style.transform  = 'translateX(' + (-_pag * cw) + 'px)';
  pwUpdateArrow();
}

// Cargar resultados desde Firebase y renderizar
function pwFetch() {
  fetch(_FB + '/portada/resultados.json?nc=' + Math.random())
    .then(function(r) { return r.json(); })
    .then(function(data) { _lastResultados = data || {}; pwRender(_lastResultados); })
    .catch(function()   {});
}
requestAnimationFrame(pwFetch);
setInterval(pwFetch, 60000);
fetch(_FB + '/equipos_ko.json')
  .then(function(r){ return r.json(); })
  .then(function(d){ if (d) { _equiposKO = d; pwRender(_lastResultados); } })
  .catch(function(){});
</script>
